<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="preconnect" href="https://fonts.google.com/" />
    <link rel="stylesheet" href="https://fonts.google.com/specimen/Nunito" />
    <title>SignUp-Pisocial</title>
  </head>
  <body>
    <main class="container">
      <section class="red-networks">
        <article class="networks-content">
          <button class="btn">
            <img src="./img/Linkedin.png" alt="" />Sign up with Linkedln
          </button>
          <button class="btn">
            <img src="./img/twitter.png" alt="" />Sign up with Twitter
          </button>
          <button class="btn">
            <img src="./img/Facebook.png" alt="" />Sign up with Facebook
          </button>
        </article>
      </section>
      <section class="form-container">
        <div class="header">
          <img src="img/decoration1.png" alt="">
        </div>
        <article class="form">
          <h1>Sign Up</h1>
          <h2>Get started absolutely free</h2>
          <form class="form-content">
            <div class="conteiner-input">
              <label class="input">
                Email
                <input  class="registration" type="email" />
              </label>
              <label class="input">
                Password
                <input  class="registration" type="password" />
              </label class="input">
              <label class="checkbox">
                <span>
                <input  type="checkbox" />
                </span>
                Creating an account means you’re okay with our Terms of Service, <br>
                Privacy Policy, and default Notification Settings
              </label>
            </div>
            <button class="btn-form">Sign Up</button>
          </form>
        </article>
        <div class="footer">
          <img src="img/decoration2.png" alt="">
        </div>
      </section>
    </main>
  </body>
</html>
